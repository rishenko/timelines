# Checks every push to main and every pull request: lint, tests (including the accessibility checks), the
# type-check and build, and the included timelines' data (see docs/development.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled too, so adding `rishenko-overrides` re-runs the overrides check
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Normal run: about 4 minutes; capped at 3x
    timeout-minutes: 12
    strategy:
      matrix:
        # the oldest supported Node line and the current LTS
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Every file field in src/types.ts is in docs/data-format.md, and every npm script in docs/development.md
      - run: npm run docs:check
      - run: npm run build

      # The content scripts must reproduce the source file exactly
      - run: npm run data:check
      - run: npm run sources:check
      # R4: every row id shared by two timelines has a verdict (same or namesake) and data-src/row-identity.json is current
      - run: node scripts/row-identity.ts --check

      # The included timelines (Ancient and Classical, Modern States) and the key-event list must be what data-src/
      # compiles to
      - name: Compiled timeline matches data-src/
        run: |
          npm run data:build
          npm run importance
          git diff --exit-code -- public/timelines docs

      # No id a link can name (rows, events, eras, regions, sources, tags…) disappears without a redirect. Compares
      # with the pull request's base branch, or with the commit before a push (docs/data-format.md#keeping-ids-stable)
      - name: No id lost without a redirect
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.base_ref || github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          npm run data -- ids --check --base FETCH_HEAD

  # The extractor's unit tests (pipelines/extract/). They use inline fixtures and temporary databases only: no dump,
  # no ~/data
  extract:
    runs-on: ubuntu-latest
    # The whole job takes about a minute; a hang (the pbz2 pool hit it twice) fails here instead of after GitHub's six hours
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipelines/extract/requirements.txt
      - run: pip install -r pipelines/extract/requirements.txt
      # Every Python unit test in the repo, found rather than listed (pipelines/**/test_*.py), so a new test runs without a
      # ci.yml edit and test PRs no longer collide on one line. Each runs from its own folder, as the tests expect. They use
      # inline fixtures and temporary files only: no dump, no ~/data. SKIP lists a test that must not run here, one path per
      # line with its reason (none today). Each file gets 5 minutes (the slowest takes about 30 seconds): on a hang timeout sends
      # SIGABRT and faulthandler prints every thread's stack, so the log shows where it stuck.
      - name: Python unit tests
        run: |
          SKIP=''
          fail=0
          for f in $(find pipelines -name 'test_*.py' -not -path '*/.venv/*' | sort); do
            if printf '%s\n' "$SKIP" | grep -qxF "$f"; then echo "skip $f"; continue; fi
            echo "::group::$f"
            if ! (cd "$(dirname "$f")" && timeout -s ABRT -k 10 300 python -X faulthandler -I "$(basename "$f")"); then echo "::error file=$f::failed"; fail=1; fi
            echo "::endgroup::"
          done
          exit $fail
      # The emitters run from the committed inputs (pipelines/v2/inputs, trimmed from the harvest) and the checkout's compiled
      # timelines, no dump needed: the emitted files are what they produce
      - name: Emitted files reproduce
        run: |
          python -I pipelines/v2/emit.py disaster > /dev/null
          python -I pipelines/v2/emit.py conflict > /dev/null
          git diff --exit-code -- pipelines/v2/emitted
      # The regeneration stamp (data-src/provenance/regen.json): the hashes of the route's inputs and outputs. Report only until the
      # first regeneration is committed; then it becomes a required check (npm run data:regen writes it)
      - name: Regen stamp (report only)
        continue-on-error: true
        run: node scripts/regen.ts --verify
      # The GitHub account name labels pull requests but never appears in timeline data (pipelines/common/name_guard.py)
      - name: Account name not in data
        run: python -I pipelines/common/name_guard.py
      # Ancient's scripts never delete an event: a reign, conflict or disaster event that no frozen or emitted file owns would stay for good
      - name: Ancient owned ids
        run: python -I pipelines/common/owned_ids_check.py
      # The crew's rulings (pipelines/common/rulings.json, docs/provenance.md): required fields, known kinds, unique ids, a role in decided_by
      - name: Rulings file
        run: python -I pipelines/common/rulings.py
      # R1 (ontology review): every Medieval and Modern row that links an article carries its Wikidata item (pipelines/common/row_ids_check.py)
      - name: Row Wikidata ids
        run: python -I pipelines/common/row_ids_check.py
      # Kevin's reviewed category overrides change only in a pull request he labels `rishenko-overrides`; a pipeline sets
      # categories through the pinned layer (pipelines/common/overrides_guard.py)
      # Always against main, not the PR's base: a stacked PR must not hide override writes it inherits from its base PR
      - name: Reviewed overrides unchanged
        if: github.event_name == 'pull_request'
        env:
          OVERRIDES_ALLOWED: ${{ contains(github.event.pull_request.labels.*.name, 'rishenko-overrides') }}
          GUARD_BASE: main
        run: |
          git fetch --no-tags --depth=1 origin "$GUARD_BASE"
          python -I pipelines/common/overrides_guard.py --base FETCH_HEAD
      # No added event repeats an existing one, and no war is wide by hand (pipelines/common/duplicates_guard.py); against main
      - name: No duplicate events
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin main
          python -I pipelines/common/duplicates_guard.py --base FETCH_HEAD
      # No committed reign (pipelines/**/reigns.json, *-reigns.json) is lost or changed against main unless Kevin labels the pull
      # request `rishenko-reigns` (pipelines/common/reigns_guard.py): a re-freeze can't re-record its own inputs unseen
      - name: Committed reigns unchanged
        if: github.event_name == 'pull_request'
        env:
          REIGNS_ALLOWED: ${{ contains(github.event.pull_request.labels.*.name, 'rishenko-reigns') }}
        run: |
          git fetch --no-tags --depth=1 origin main
          python -I pipelines/common/reigns_guard.py --base FETCH_HEAD

  # No committed reign is lost or changed: re-freezes the recorded rulers inputs (branch regression-inputs, kc2-inputs: the inputs the committed reigns.json files were frozen from, and the infobox
  # term labels, so no Wikipedia dump is needed) and compares with pipelines/<generator>/reigns.json. Every guard added to
  # reigns_freeze.py runs through it; there is no allow-list: a change that moves a reign is a re-freeze in its own data pull request (pipelines/README.md)
  freeze-regression:
    runs-on: ubuntu-latest
    # Normal run: under a minute
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: 243f9ad55bb5d57c6fcb56529604688ccd40dfaa  # pinned: a commit of regression-inputs; a refresh moves the pin in the same pull request
          path: .regression-inputs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipelines/extract/requirements.txt
      - run: pip install -r pipelines/extract/requirements.txt
      - name: Freeze regression
        run: python -I pipelines/extract/freeze_regression.py .regression-inputs/kc2-inputs
      # The rulers stage's committed record (data-src/provenance/stages/rulers.record.json): the recorded inputs are exactly the ones recorded, and every
      # shipped reign's route and cited text is in them. Node builtins only (no npm ci)
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Rulers stage record
        run: node scripts/stage-record.ts check rulers .regression-inputs/kc2-inputs
      # Report mode (Kevin's calls of 2026-11-24 turn it into a gate once the pilot rows are fixed): counts per check, with the allowlists in pipelines/extract/reign-audit/
      - name: Reign audit (report)
        run: python -I pipelines/extract/reign_audit.py .regression-inputs/kc2-inputs --out /tmp/reign-audit
