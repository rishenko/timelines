# Checks every push to main and every pull request: lint, tests (including the accessibility checks), the
# type-check and build, and the included timelines' data (see docs/development.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # the oldest supported Node line and the current LTS
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Every file field in src/types.ts is in docs/data-format.md, and every npm script in docs/development.md
      - run: npm run docs:check
      - run: npm run build

      # The content scripts must reproduce the source file exactly
      - run: npm run data:check
      - run: npm run sources:check

      # The included timelines (Ancient and Classical, Modern States) and the key-event list must be what data-src/
      # compiles to
      - name: Compiled timeline matches data-src/
        run: |
          npm run data:build
          npm run importance
          git diff --exit-code -- public/timelines docs

      # No id a link can name (rows, events, eras, regions, sources, tags…) disappears without a redirect. Compares
      # with the pull request's base branch, or with the commit before a push (docs/data-format.md#keeping-ids-stable)
      - name: No id lost without a redirect
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.base_ref || github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          npm run data -- ids --check --base FETCH_HEAD

  # The extractor's unit tests (pipelines/extract/). They use inline fixtures and temporary databases only: no dump,
  # no ~/data
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipelines/extract/requirements.txt
      - run: pip install -r pipelines/extract/requirements.txt
      - name: Extractor tests
        working-directory: pipelines/extract
        run: |
          for t in test_dates test_extractors test_wd_join test_wikidata test_wd_status; do
            python -I "$t.py"
          done
      # The shared event classifier's rules (pipelines/common/event_categories.py) and the traditions applier: no dump needed
      - name: Classifier tests
        run: |
          python -I pipelines/common/test_event_categories.py
          python -I pipelines/common/test_traditions.py
          python -I pipelines/common/test_science.py
          python -I pipelines/ancient/test_locator_quotes.py
      # The Medieval description check (pipelines/medieval/description_check.py): no dump needed
      - name: Description check tests
        run: python -I pipelines/medieval/test_description_check.py
      # The shared source cache (pipelines/common/source_cache.py): fetch-once caches and the phrase check; no network
      - name: Source cache tests
        run: python -I pipelines/common/test_source_cache.py
