# Checks every push to main and every pull request: lint, tests (including the accessibility checks), the
# type-check and build, and the included timelines' data (see docs/development.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # the oldest supported Node line and the current LTS
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Every file field in src/types.ts is in docs/data-format.md, and every npm script in docs/development.md
      - run: npm run docs:check
      - run: npm run build

      # The content scripts must reproduce the source file exactly
      - run: npm run data:check

      # The included timelines (Ancient and Classical, Modern States) and the key-event list must be what data-src/
      # compiles to
      - name: Compiled timeline matches data-src/
        run: |
          npm run data:build
          npm run importance
          git diff --exit-code -- public/timelines docs

      # No id a link can name (rows, events, eras, regions, sources, tags…) disappears without a redirect. Compares
      # with the pull request's base branch, or with the commit before a push (docs/data-format.md#keeping-ids-stable)
      - name: No id lost without a redirect
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.base_ref || github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          npm run data -- ids --check --base FETCH_HEAD
