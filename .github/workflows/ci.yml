# Checks every push to main and every pull request: lint, tests (including the accessibility checks), the
# type-check and build, and the included timelines' data (see docs/development.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # the oldest supported Node line and the current LTS
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # The content scripts must reproduce the source file exactly
      - run: npm run data:check

      # The included timelines (Ancient and Classical, Modern States), their list (index.json) and key-event list
      # must be what data-src/ compiles to
      - name: Compiled timeline matches data-src/
        run: |
          npm run data:build
          npm run importance
          git diff --exit-code -- public/timelines docs
